name: Native Android Build

# Trigger this manually from the GitHub app: Actions tab -> "Native Android
# Build" -> Run workflow. Plain Gradle build on GitHub's own runners - no
# account, no token, no monthly quota (unlike the old EAS workflow).
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Build failed, posting log to issue #1:"
            {
              echo "Native build failed in run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})."
              echo '```'
              tail -c 60000 /tmp/build.log
              echo '```'
            } > /tmp/issue-comment-body.md
            jq -Rs '{body: .}' /tmp/issue-comment-body.md | gh api repos/${GITHUB_REPOSITORY}/issues/1/comments --input -
          fi
          exit "$status"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # GitHub Actions artifact downloads (actions/upload-artifact) are
      # served from Azure Blob Storage, which isn't reachable from the
      # sandbox this is built from - so the APK is also published as a
      # GitHub Release asset, served directly from github.com, which both
      # the sandbox and a phone browser can reach. Reuses one mutable tag
      # ("native-debug-latest") so every build updates the same stable
      # link instead of accumulating a new release each time.
      - name: Publish APK to a stable release
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk NavOS-debug.apk
          gh release delete native-debug-latest --yes || true
          git tag -f native-debug-latest
          git push origin native-debug-latest --force
          gh release create native-debug-latest NavOS-debug.apk \
            --title "NavOS (native, debug build)" \
            --notes "Auto-published from run ${GITHUB_RUN_ID}. Debug build, self-signed with Android's default debug key - for testing on your own phone only." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
