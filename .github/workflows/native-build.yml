name: Native Android Build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Post failure log to tracking issue
        if: failure()
        run: |
          tail -c 60000 /tmp/build.log > /tmp/build-tail.log || true
          {
            echo "Native build failed in run ${{ github.run_id }}."
            echo '```'
            cat /tmp/build-tail.log
            echo '```'
          } > /tmp/comment.md
          jq -Rs '{body: .}' /tmp/comment.md | gh api repos/${{ github.repository }}/issues/1/comments --input -
        env:
          GH_TOKEN: ${{ github.token }}
