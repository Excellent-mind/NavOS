name: UI Check

# Manual: Actions tab -> "UI Check" -> Run workflow. Builds the debug APK,
# boots an Android emulator on GitHub's runner, walks the main screens
# (home sheet drag/fling, search, settings, dropped pin card, route preview,
# drive bar, dark mode) and uploads screenshots, a screen recording and any
# crash log as the "ui-check" artifact. Does not touch releases.
on:
  workflow_dispatch: {}
  # Manual dispatch only works once this file is on the default branch, so
  # it also runs on pushes to the polish branch it was added on.
  push:
    branches: [ccr-ce953277-r3uhzr]

jobs:
  ui-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The runner image is too full for an emulator's userdata partition;
      # drop toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui-check.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check
          path: ui-check/
