name: Create signing key (run ONCE)

# Run once: Actions tab -> "Create signing key (run ONCE)" -> Run workflow.
# It makes your release key and saves the 4 secret values in a text file
# (artifact "signing-secrets", kept 1 day). Copy them into repository
# secrets, then delete the artifact. Do NOT run this again later: a new run
# makes a different key, and phones that have the old one can't update.
on:
  workflow_dispatch: {}

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate key and secret values
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore release.jks -alias navos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=NavOS, O=NavOS, C=MY"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=navos"
            echo "KEY_PASSWORD=$PASS"
            echo "KEYSTORE_BASE64=$(base64 -w 0 release.jks)"
          } > signing-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: signing-secrets
          path: signing-secrets.txt
          retention-days: 1
