name: Debug APK crash (Android emulator)

# Trigger manually from the GitHub app: Actions tab -> "Debug APK crash
# (Android emulator)" -> Run workflow, pasting in the expo.dev build's
# .apk download URL. This boots a virtual Android phone on GitHub's own
# servers, installs the APK, opens the app, and posts whatever crashed to
# issue #1 - no phone steps needed.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct .apk download URL from the Expo build page"
        required: true

permissions:
  contents: read
  issues: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Download the APK
        run: curl -fSL -o /tmp/app.apk "${{ github.event.inputs.apk_url }}"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install app, capture crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            adb logcat -c
            adb install -r /tmp/app.apk
            adb shell pm grant com.excellentmindblow.navos android.permission.ACCESS_FINE_LOCATION
            adb shell pm grant com.excellentmindblow.navos android.permission.ACCESS_COARSE_LOCATION
            adb shell monkey -p com.excellentmindblow.navos -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d > /tmp/full-logcat.txt
            {
              echo "## adb install output / app state"
              adb shell pm list packages | grep navos
              echo
              echo "## Crash-relevant logcat (AndroidRuntime, FATAL, navos pid, native crash tombstones)"
              grep -iE "AndroidRuntime|FATAL EXCEPTION|com.excellentmindblow.navos|libc |DEBUG.*pid|signal [0-9]+|SIGSEGV|SIGABRT|backtrace" /tmp/full-logcat.txt | tail -c 55000
            } > /tmp/crash-summary.txt
            cat /tmp/crash-summary.txt

      - name: Post crash log to tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Crash capture from emulator run ${GITHUB_RUN_ID}, APK: ${{ github.event.inputs.apk_url }}"
            echo '```'
            cat /tmp/crash-summary.txt 2>/dev/null || echo "(no crash-summary.txt produced - see full logcat below)"
            echo '```'
          } > /tmp/issue-comment-body.md
          jq -Rs '{body: .}' /tmp/issue-comment-body.md | gh api repos/${GITHUB_REPOSITORY}/issues/1/comments --input -

      - name: Upload full logcat as a build artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-logcat
          path: /tmp/full-logcat.txt
          retention-days: 7
