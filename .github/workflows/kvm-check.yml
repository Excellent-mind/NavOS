name: KVM check
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check KVM availability
        run: |
          echo "--- /dev/kvm ---"
          ls -la /dev/kvm 2>&1 || echo "NO /dev/kvm"
          echo "--- kvm-ok (if present) ---"
          which kvm-ok 2>&1 && kvm-ok 2>&1 || echo "kvm-ok not installed"
          echo "--- cpuinfo virtualization flags ---"
          grep -E "vmx|svm" /proc/cpuinfo | head -1 || echo "no vmx/svm flags"
          echo "--- groups ---"
          groups
          echo "--- disk space ---"
          df -h /
