name: KVM check
on:
  workflow_dispatch: {}
permissions:
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Before - permissions and groups
        run: |
          echo "## BEFORE: /dev/kvm"
          ls -la /dev/kvm 2>&1 || echo "NO /dev/kvm"
          echo "## BEFORE: groups"
          groups

      - name: Apply the udev KVM-for-all rule
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 2

      - name: After - permissions and groups, report to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## AFTER udev rule: /dev/kvm"
            ls -la /dev/kvm 2>&1 || echo "NO /dev/kvm"
            echo
            echo "## AFTER udev rule: can current user read+write it directly?"
            test -r /dev/kvm && echo "readable: yes" || echo "readable: NO"
            test -w /dev/kvm && echo "writable: yes" || echo "writable: NO"
            echo
            echo "## groups (unchanged within same job - group membership needs new login)"
            groups
            echo
            echo "## Try opening /dev/kvm directly with python"
            python3 -c "
try:
    f = open('/dev/kvm', 'r+b')
    print('OPENED /dev/kvm successfully')
    f.close()
except Exception as e:
    print('FAILED to open /dev/kvm:', e)
"
          } > /tmp/kvm-report2.txt
          cat /tmp/kvm-report2.txt
          jq -Rs '{body: .}' /tmp/kvm-report2.txt | gh api repos/${GITHUB_REPOSITORY}/issues/1/comments --input -
