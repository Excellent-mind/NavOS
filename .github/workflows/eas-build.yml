name: EAS Build (Android APK)

# Trigger this manually from the GitHub app: Actions tab -> "EAS Build
# (Android APK)" -> Run workflow. Builds happen on Expo's own cloud servers,
# so no computer is needed - just a phone with the GitHub app.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Link EAS project (creates it on first run, no-op after)
        run: eas init --account excellent-mindblow --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Save project link back to the repo
        run: |
          if ! git diff --quiet -- app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Link EAS project id in app.json [skip ci]"
            git push
          else
            echo "app.json already up to date, nothing to commit."
          fi

      - name: EAS build (preview APK)
        run: |
          set +e
          eas build --platform android --profile preview --non-interactive --non-interactive 2>&1 | tee /tmp/eas-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Build failed, dumping cleaned tail as annotations:"
            tr '\r' '\n' < /tmp/eas-build.log | sed '/^[[:space:]]*$/d' | uniq | tail -n 80 > /tmp/eas-build-clean.log
            while IFS= read -r line; do
              safe=$(echo "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::${safe}"
            done < /tmp/eas-build-clean.log
          fi
          exit "$status"
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
