name: EAS Build (Android APK)

# Trigger this manually from the GitHub app: Actions tab -> "EAS Build
# (Android APK)" -> Run workflow. Builds happen on Expo's own cloud servers,
# so no computer is needed - just a phone with the GitHub app.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Link EAS project (creates it on first run, no-op after)
        run: eas init --account excellent-mindblow --non-interactive --force
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Save project link back to the repo
        run: |
          if ! git diff --quiet -- app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Link EAS project id in app.json [skip ci]"
            git push
          else
            echo "app.json already up to date, nothing to commit."
          fi

      - name: EAS build (preview APK)
        run: |
          set +e
          eas build --platform android --profile preview --non-interactive 2>&1 | tee /tmp/eas-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Build failed, posting full cleaned log to issue #1:"
            tr '\r' '\n' < /tmp/eas-build.log | sed '/^[[:space:]]*$/d' | uniq > /tmp/eas-build-clean.log
            {
              echo "Build failed in run ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})."
              echo '```'
              tail -c 60000 /tmp/eas-build-clean.log
              echo '```'
            } > /tmp/issue-comment-body.md
            gh api repos/${GITHUB_REPOSITORY}/issues/1/comments -f body=@/tmp/issue-comment-body.md
          fi
          exit "$status"
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
