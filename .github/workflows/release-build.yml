name: Release APK (signed)

# Run manually: Actions tab -> "Release APK (signed)" -> Run workflow.
# Needs 4 repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   your keystore file, base64 encoded
#   KEYSTORE_PASSWORD keystore password
#   KEY_ALIAS         key alias
#   KEY_PASSWORD      key password
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navos-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK to a release
        run: |
          cp app/build/outputs/apk/release/app-release.apk NavOS-release.apk
          gh release delete native-release-latest --yes || true
          git tag -f native-release-latest
          git push origin native-release-latest --force
          gh release create native-release-latest NavOS-release.apk \
            --title "NavOS (signed release)" \
            --notes "Signed release build from run ${GITHUB_RUN_ID}." \
            --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
