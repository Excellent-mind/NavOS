# One-off data job: fetches candidate brand logos and Malaysian road sign
# files from Wikimedia Commons (tools/logos/fetch_logos.py) with their
# licences, and uploads them as an artifact to pick from. Commons rate-limits
# the dev machine, so this runs here. Runs when the script changes, or by hand.
name: Logos
on:
  workflow_dispatch:
  push:
    paths: ["tools/logos/fetch_logos.py"]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/logos/fetch_logos.py logos
      - uses: actions/upload-artifact@v4
        with:
          name: logos
          path: logos
